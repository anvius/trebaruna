name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The PDF libraries require 1.27; see go.mod.
          go-version: '1.27'
          cache: true

      # openssl and poppler are exercised by the integration tests: the CMS
      # output is verified with openssl, and page rendering uses pdftoppm.
      # softhsm2 and opensc give the PKCS#11 tests a real token in software: the
      # session-handling bug they guard against only appeared with a live driver.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl poppler-utils softhsm2 opensc qpdf libnss3-tools

      - name: Static analysis
        run: |
          go vet ./...
          test -z "$(gofmt -l src tests)" || (echo "gofmt needed:"; gofmt -l src tests; exit 1)

      - name: Unit, domain and integration tests
        run: CGO_ENABLED=1 go test ./tests/... -count=1 -race
      # Two builds of the same commit from different directories must match:
      # that is what lets anyone check a published binary (ADR-0017).
      - name: Reproducible build
        run: make reproducible

      # The PKCS#11 adapter is behind the `token` tag, so the default run never
      # compiles it. This job does, and exercises it against SoftHSM.
      - name: PKCS#11 tests against SoftHSM
        run: |
          SOFTHSM2_MODULE=$(dpkg -L libsofthsm2 | grep -m1 'libsofthsm2\.so$')
          CGO_ENABLED=1 SOFTHSM2_MODULE="$SOFTHSM2_MODULE" \
            go test -tags token ./tests/signing/token/ -count=1 -v

      - name: Build the PKCS#11 binary
        run: CGO_ENABLED=1 go build -trimpath -tags token -o bin/trebaruna-token ./src/entrypoint/main

      - name: Build the static CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/trebaruna ./src/entrypoint/main

      - name: Smoke test
        run: ./bin/trebaruna version

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/trebaruna ./src/entrypoint/main

  macos:
    name: macOS app bundle
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Fyne needs cgo for Cocoa, which only exists on a macOS runner. This
          # is why the .app cannot be cross-compiled from Linux.
          go-version: '1.27'
      - name: Build and package
        run: VERSION="$(cat VERSION)" ./packaging/macos/build-app.sh
      - name: Smoke test the CLI inside the bundle
        run: ./dist/trebaruna.app/Contents/MacOS/trebaruna version
      - name: Verify the bundle layout
        run: |
          test -f dist/trebaruna.app/Contents/Info.plist
          test -f dist/trebaruna.app/Contents/MacOS/trebaruna
          test -f dist/trebaruna.app/Contents/MacOS/trebaruna-desktop
          plutil -lint dist/trebaruna.app/Contents/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: trebaruna-macos-${{ runner.arch }}
          path: dist/trebaruna.app

  gui:
    name: Build the desktop app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # Fyne needs cgo and the windowing headers; this is why the GUI is a
      # separate binary instead of part of the static CLI.
      - name: Install GUI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      # The translation tests only exist behind the gui tag, because the file
      # they test imports Fyne. This job is the only one that can run them, and
      # the Spanish shadowing defect survived precisely because no CI did.
      - name: Translation and window tests
        run: CGO_ENABLED=1 go test -tags gui -race ./src/desktop/... ./tests/desktop/... -count=1
      - name: Build
        run: CGO_ENABLED=1 go build -tags gui -trimpath -o bin/trebaruna-desktop ./src/entrypoint/desktop
      # The packaging script and the install target both broke silently once
      # (an untracked script, a renamed .desktop file): running them here is
      # what keeps a fresh clone able to package and install.
      - name: Package and install into a scratch root
        run: |
          make package-desktop
          make install-desktop DESTDIR="$RUNNER_TEMP/root" PREFIX=/usr
          test -f "$RUNNER_TEMP/root/usr/share/applications/trebaruna.desktop"
          test "$("$RUNNER_TEMP/root/usr/bin/trebaruna" version)" = "$(cat VERSION)"
          # ADR-0016: the CLI installed next to the window can talk to cards.
          "$RUNNER_TEMP/root/usr/bin/trebaruna" about --json | grep -q '"pkcs11": true'
      - uses: actions/upload-artifact@v4
        with:
          name: trebaruna-desktop-linux-amd64
          path: bin/trebaruna-desktop
